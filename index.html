<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silk Designer | REHC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#11202E; --navy-2:#1B3047; --gold:#AC9C71; --gold-soft:#E9E2CF; --maroon:#980B2C;
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F8F9; --ink:#11202E; --muted:#6B7480; --line:#E4E6EA;
  --stage-1:#FFFFFF; --stage-2:#ECEEF1;
  --shadow:0 1px 2px rgba(17,32,46,.06), 0 8px 24px rgba(17,32,46,.06);
  --shadow-lift:0 2px 4px rgba(17,32,46,.08), 0 12px 28px rgba(17,32,46,.10);
  --warn-bg:#FBF4E4; --warn-ink:#6A4A0C; --err-bg:#FBEAEE; --err-ink:#980B2C;
  --hd:'Montserrat','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bd:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:10px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A121A; --surface:#111C27; --surface-2:#16232F; --ink:#EDEFF2; --muted:#9AA4AF; --line:#22313F;
    --stage-1:#1A2836; --stage-2:#0F1A24; --gold-soft:#2C2A22;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lift:0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.35);
    --warn-bg:#2B2414; --warn-ink:#F0D9A4; --err-bg:#2E151B; --err-ink:#F5B8C4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A121A; --surface:#111C27; --surface-2:#16232F; --ink:#EDEFF2; --muted:#9AA4AF; --line:#22313F;
  --stage-1:#1A2836; --stage-2:#0F1A24; --gold-soft:#2C2A22;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lift:0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.35);
  --warn-bg:#2B2414; --warn-ink:#F0D9A4; --err-bg:#2E151B; --err-ink:#F5B8C4;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--bd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent)}
header .hd-in{max-width:1180px;margin:0 auto;padding:18px 24px 20px;display:flex;align-items:center;gap:24px}
.logo{height:84px;width:auto;display:block;flex:none}
.hd-txt{border-left:1px solid rgba(172,156,113,.45);padding-left:24px;min-width:0}
@media (max-width:599px){ header .hd-in{gap:14px;padding:14px 16px 16px} .logo{height:52px} .hd-txt{padding-left:14px} header h1{font-size:22px !important} }
header .club{margin:0;font:600 11.5px/1.3 var(--hd);letter-spacing:.06em;color:var(--gold)}
header h1{margin:6px 0 0;font:700 30px/1.1 var(--hd);letter-spacing:-.02em}

main{max-width:1180px;margin:0 auto;padding:24px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ main{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start;padding-top:28px} .stage{position:sticky;top:20px} }

.stage,.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.stage{padding:16px}
.controls{padding:8px 20px 4px}
.preview{display:flex;gap:10px;align-items:flex-end;justify-content:center;padding:22px 12px 16px;border-radius:var(--r-md);background:radial-gradient(120% 90% at 50% 25%,var(--stage-1) 0%,var(--stage-2) 100%)}
.preview .main-svg{width:100%;max-width:310px;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(17,32,46,.16))}
@media (max-width:899px){ .preview .main-svg{max-width:210px} main{padding:16px} .controls{padding:6px 16px 2px} .tab{flex:1 1 auto;padding:9px 8px;font-size:12.5px} }
.spare{display:none;flex-direction:column;align-items:center;gap:6px;width:80px;flex:none}
.spare.on{display:flex}
.spare svg{width:80px;height:auto;filter:drop-shadow(0 6px 8px rgba(17,32,46,.14))}
.spare span{font:600 11px/1.3 var(--hd);color:var(--muted);text-align:center}

.entry{margin-top:16px;padding:0 4px}
.entry h2{font:600 11.5px/1.3 var(--hd);letter-spacing:.05em;color:var(--gold);margin:0 0 6px}
.entry p{font:600 17px/1.45 var(--hd);letter-spacing:-.01em;margin:0}
.entry .valid{font:400 13px/1.5 var(--bd);color:var(--muted);margin-top:8px;letter-spacing:0}

.msgs{display:grid;gap:8px;margin-top:12px}
.msg{font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:var(--r-sm)}
.msg.err{background:var(--err-bg);color:var(--err-ink)}
.msg.warn{background:var(--warn-bg);color:var(--warn-ink)}

.fields{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;margin-top:18px;padding:0 4px}
.fields label{display:flex;flex-direction:column;gap:6px;font:600 12px/1.3 var(--hd);color:var(--muted)}
.fields input{font:500 15px/1.3 var(--bd);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
.fields input::placeholder{color:var(--muted);opacity:.7}
.fields input:focus{outline:none;background:var(--surface);border-color:var(--gold);box-shadow:0 0 0 3px rgba(172,156,113,.25)}
.fname{font-size:12.5px;color:var(--muted);margin:8px 4px 0;overflow-wrap:anywhere}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
button{font:inherit;color:inherit}
.btn{border:1px solid transparent;background:var(--navy);color:#fff;border-radius:999px;padding:11px 16px;font:600 13.5px/1.2 var(--hd);cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s;box-shadow:0 1px 2px rgba(17,32,46,.2)}
.btn:hover:not(:disabled){background:var(--navy-2);box-shadow:0 6px 16px rgba(17,32,46,.22);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
#dlSheet{grid-column:1 / -1}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--gold);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dl-note{font-size:12.5px;color:var(--muted);margin:8px 4px 0}

.tabs{display:flex;gap:4px;padding:4px;margin:12px 0 4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:9px 16px;cursor:pointer;color:var(--muted);font:600 13.5px/1.2 var(--hd);border-radius:999px;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,32,46,.10),0 0 0 1px var(--line)}
.panel{padding:18px 0 4px}
.group{margin-bottom:26px}
.group h3{font:700 13px/1.3 var(--hd);margin:0 0 12px;display:flex;gap:8px;align-items:baseline;letter-spacing:-.005em}
.group h3 .val{font:500 13px/1.3 var(--bd);color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:1px solid rgba(17,32,46,.18);cursor:pointer;padding:0;position:relative;transition:transform .12s,box-shadow .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(17,32,46,.12)}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.pt{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:8px 6px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:122px;transition:transform .12s,box-shadow .15s,border-color .15s,background .15s}
.pt:hover{background:var(--surface);transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.pt svg{width:100%;height:76px}
.pt .nm{font:600 11.5px/1.25 var(--hd);text-align:center}
.pt .sb{font-size:10.5px;color:var(--muted);line-height:1.2}
.pt[aria-pressed="true"]{background:var(--surface);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),inset 0 0 0 1px var(--gold)}
.toggle{display:flex;gap:12px;align-items:flex-start;font-size:14px;margin-bottom:18px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.toggle input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy)}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 18px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{max-width:1180px;margin:0 auto;padding:4px 24px 32px;font-size:12px;line-height:1.6;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
// Racing colours pattern library — REHC Rules of Racing, Annexe 6 (pp.78–82).
// All coordinates are in the REHC silks template space (front view, viewBox -6 -4 440 612).
const X0 = 213.6;            // centre line of the jacket (zip)
const SL = 380;              // sleeve length in local sleeve units

const f = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => f(p[0]) + ',' + f(p[1])).join(' ');
const P = (a, c) => `<polygon points="${pts(a)}" fill="${c}"/>`;
const R = (x, y, w, h, c) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${c}"/>`;
const C = (x, y, r, c) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${c}"/>`;
const E = (x, y, rx, ry, c) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${c}"/>`;
const LN = (a, c, w) => `<polyline points="${pts(a)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="miter" stroke-miterlimit="10"/>`;
const D = (x, y, hw, hh, c) => P([[x, y - hh], [x + hw, y], [x, y + hh], [x - hw, y]], c);
function S(cx, cy, R0, c) {
  const a = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? R0 * 0.4 : R0, t = -Math.PI / 2 + i * Math.PI / 5;
    a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
  }
  return P(a, c);
}
const zig = (cy, amp, step, x0, x1, c, w) => {
  const a = []; let up = true;
  for (let x = x0; x <= x1 + step; x += step) { a.push([x, cy + (up ? -amp : amp)]); up = !up; }
  return LN(a, c, w);
};
const mirror = a => a.map(p => [2 * X0 - p[0], p[1]]);

// ---------- MAIN BODY (Figure 4) ----------

  { id: 'plain', name: 'Plain', note: 'Shown as "White" in Annexe 6', d: () => '' },

  { id: 'inverted-triangle', name: 'Inverted Triangle', d: c => P([[166, 292], [261.2, 292], [X0, 374]], c) },
  { id: 'disc', name: 'Disc', d: c => E(X0, 372, 74, 80, c) },

<script>
// Builds silks SVG markup from the REHC template geometry (GEO) and the pattern library.
function buildDefs(GEO) {
  const tb = 'translate(-390.75 0)', ts = 'translate(-781.66 0)';
  const outL = [[1.4, 181.5], [80.7, 192.2], [31.1, 558.9], [-48.2, 548.2]];
  const outR = outL.map(p => [Math.round((2 * X0 - p[0]) * 10) / 10, p[1]]);
  const poly = a => a.map(p => p.join(',')).join(' ');
  return `
<path id="pBody" transform="${tb}" d="${GEO.body}"/>
<path id="pCap" transform="${tb}" d="${GEO.cap}"/>
<path id="pSlvL" transform="${ts}" d="${GEO.slvL}"/>
<path id="pSlvR" transform="${ts}" d="${GEO.slvR}"/>
<clipPath id="cBody"><path transform="${tb}" d="${GEO.body}"/></clipPath>
<clipPath id="cCap"><path transform="${tb}" d="${GEO.cap}"/></clipPath>
<clipPath id="cSlvL"><path transform="${ts}" d="${GEO.slvL}"/></clipPath>
<clipPath id="cSlvR"><path transform="${ts}" d="${GEO.slvR}"/></clipPath>
<clipPath id="cCrown"><ellipse cx="${X0}" cy="63.6" rx="53" ry="61.6"/></clipPath>
<clipPath id="cSeamB"><polygon points="-20,-20 150,-20 150,208 277,208 277,-20 450,-20 450,586 -20,586"/></clipPath>
<clipPath id="cSeamOutL"><polygon points="${poly(outL)}"/></clipPath>
<clipPath id="cSeamOutR"><polygon points="${poly(outR)}"/></clipPath>
<g id="art"><path fill="#231f20" d="${GEO.a1}"/><path fill="#231f20" d="${GEO.a2}"/><path fill="#393536" d="${GEO.a3}"/></g>`;
}

const U = id => `href="#${id}" xlink:href="#${id}"`;
const find = (list, id) => list.find(p => p.id === id) || list[0];

function sleeveMarkup(side, s, hex) {
  const p = find(SLEEVES, s.p), pc = hex(s.pc);
  let pat = '';
  if (p.seam) pat = '';
  else
  if (p.id !== 'plain') pat = `<g transform="${SLEEVE_FRAME[side]}">${p.d(pc, side)}</g>`;
  return `<g clip-path="url(#cSlv${side})"><use ${U('pSlv' + side)} fill="${hex(s.c)}"/>${pat}</g>`;
}
// Seams are piping along the edge, drawn above the line art so they stay visible
function sleeveSeam(side, s, hex) {
  return `<g clip-path="url(#cSlv${side})"><g clip-path="url(#cSeamOut${side})"><use ${U('pSlv' + side)} fill="none" stroke="${hex(s.pc)}" stroke-width="12"/></g></g>`;
}
function bodySeam(b, hex) {
  return `<g clip-path="url(#cBody)"><g clip-path="url(#cSeamB)"><use ${U('pBody')} fill="none" stroke="${hex(b.pc)}" stroke-width="14"/></g></g>`;
}
function bodyMarkup(b, hex) {
  const p = find(BODY, b.p);
  return `<g clip-path="url(#cBody)"><use ${U('pBody')} fill="${hex(b.c)}"/>${p.id === 'plain' || p.seam ? '' : p.d(hex(b.pc))}</g>`;
}
function capMarkup(k, hex) {
  const p = find(CAPS, k.p);
  return `<g clip-path="url(#cCap)"><use ${U('pCap')} fill="${hex(k.c)}"/><g clip-path="url(#cCrown)">${p.id === 'plain' ? '' : p.d(hex(k.pc))}</g></g>`;
}
// parts: which regions to draw (thumbnails can skip some); cap override for the spare cap
function silksInner(st, hex, opts = {}) {
  const cap = opts.cap || st.cap;
  let m = '';
  if (!opts.capOnly) m += sleeveMarkup('L', st.sleeves, hex) + sleeveMarkup('R', st.sleeves, hex) + bodyMarkup(st.body, hex);
  m += capMarkup(cap, hex);
  m += `<use ${U('art')}/>`;
  if (!opts.capOnly) {
    if (find(SLEEVES, st.sleeves.p).seam) m += sleeveSeam('L', st.sleeves, hex) + sleeveSeam('R', st.sleeves, hex);
    if (find(BODY, st.body.p).seam) m += bodySeam(st.body, hex);
  }
  return m;
}

if (typeof module !== 'undefined') module.exports = { buildDefs, silksInner };

<script>
const COLOURS = [
  ['beige','Beige','#D8C9A3'],['black','Black','#161616'],['brown','Brown','#6B3E1F'],['cerise','Cerise','#DE3163'],['cream','Cream','#F3EBCF'],['dark-blue','Dark Blue','#1B2A5C'],
  ['dark-green','Dark Green','#1F4D2B'],['emerald-green','Emerald Green','#0F8A55'],['gold','Gold','#C9A227'],['grey','Grey','#8C8C8C'],['light-blue','Light Blue','#8EC5E8'],
  ['light-green','Light Green','#9ACD6B'],['lime','Lime','#A6D608'],['maroon','Maroon','#6E1027'],['mauve','Mauve','#B49AC4'],['navy','Navy','#001E46'],['orange','Orange','#EE7A1E'],
  ['pink','Pink','#F2A6C0'],['purple','Purple','#5B2A86'],['red','Red','#D21F2B'],['royal-blue','Royal Blue','#2346A8'],['silver','Silver','#BFC3C8'],['turquoise','Turquoise','#1FB5B0'],
  ['white','White','#FFFFFF'],['yellow','Yellow','#F6D30F']
].map(([id,name,hex])=>({id,name,hex}));
const hex = id => (COLOURS.find(c=>c.id===id)||{hex:'#FFFFFF'}).hex;
const cname = id => (COLOURS.find(c=>c.id===id)||{name:id}).name;

const DEFAULT = () => ({
  body:{c:'royal-blue',p:'plain',pc:'white'},
  sleeves:{c:'royal-blue',p:'plain',pc:'white'},
  cap:{c:'royal-blue',p:'plain',pc:'white'},
  spare:{on:false,c:'white',p:'plain',pc:'royal-blue'}
});
let st = DEFAULT();
let tab = 'body';

document.getElementById('defs').innerHTML = buildDefs(GEO);
const $ = id => document.getElementById(id);

// ---------- description ----------
function patLabel(list,id){ const p=list.find(x=>x.id===id); return p ? p.name + (p.sub ? ' ('+p.sub+')' : '') : id; }
function part(k, region, list){
  const base = cname(k.c) + ' ' + region;
  return k.p==='plain' ? base : base + ' with ' + cname(k.pc).toLowerCase() + ' ' + patLabel(list,k.p);
}
function description(){
  let d = part(st.body,'body',BODY) + '; ' + part(st.sleeves,'sleeves',SLEEVES) + '; ' + part(st.cap,'cap',CAPS) + '.';
  return d.charAt(0).toUpperCase()+d.slice(1);
}
function spareText(){ return st.spare.on ? 'Second cap: ' + part(st.spare,'cap',CAPS) + '.' : ''; }
function validUntil(){
  const n=new Date(); const y = n.getMonth()>=9 ? n.getFullYear()+1 : n.getFullYear();
  return '30 September ' + y;
}

// ---------- checks ----------
function checks(){
  const m=[];
  const same=(k,label,list)=>{ if(k.p!=='plain' && k.c===k.pc) m.push(['err',`The ${label} pattern (${patLabel(list,k.p)}) is the same colour as the ${label}, so it won't show. Choose a different pattern colour.`]); };
  same(st.body,'body',BODY); same(st.sleeves,'sleeve',SLEEVES); same(st.cap,'cap',CAPS);
  if(st.spare.on){
    same(st.spare,'second cap',CAPS);
    if(st.spare.c===st.cap.c && st.spare.p===st.cap.p && (st.spare.p==='plain' || st.spare.pc===st.cap.pc))
      m.push(['err','The second cap matches the main cap. Article 34.4 needs a different coloured cap for a second runner.']);
  }
  const allBlack = [st.body,st.sleeves,st.cap].every(k=>k.c==='black' && (k.p==='plain' || k.pc==='black'));
  if(allBlack) m.push(['warn','All black is the colours a horse runs in when declared colours are unavailable (Article 34.5). Check with the Racing Director before applying for these.']);
  return m;
}

// ---------- rendering ----------
function render(){
  $('preview').innerHTML = silksInner(st, hex);
  $('spareWrap').classList.toggle('on', st.spare.on);
  if(st.spare.on) $('sparePrev').innerHTML = silksInner(st, hex, {cap:st.spare, capOnly:true});
  $('desc').textContent = description() + (st.spare.on ? ' ' + spareText() : '');
  $('valid').textContent = 'A registration made now would run until ' + validUntil() + ' (Article 34.1).';
  const m = checks();
  $('msgs').innerHTML = m.map(([t,x])=>`<div class="msg ${t}">${x}</div>`).join('');
  const blocked = m.some(x=>x[0]==='err');
  $('dlSheet').disabled = blocked || !dlReady; $('dlSvg').disabled = blocked || !dlReady; $('dlPng').disabled = blocked || !dlReady;
  renderPanel();
}

function swatchRow(key, field, label){
  const k = key==='spare' ? st.spare : st[key];
  return `<div class="group"><h3>${label} <span class="val">${cname(k[field])}</span></h3><div class="swatches">` +
    COLOURS.map(c=>`<button class="sw" style="background:${c.hex}" aria-pressed="${k[field]===c.id}" aria-label="${c.name}" title="${c.name}" data-k="${key}" data-f="${field}" data-v="${c.id}"></button>`).join('') + '</div></div>';
}
const VB = { body:'60 140 310 470', sleeves:'-6 180 440 420', cap:'150 -4 128 142', spare:'150 -4 128 142' };
function thumb(key, p){
  const s = JSON.parse(JSON.stringify(st));
  const region = key==='spare' ? 'cap' : key;
  const k = key==='spare' ? Object.assign({}, st.spare) : s[key];
  k.p = p.id;
  if(k.c===k.pc) k.pc = k.c==='white' ? 'black' : 'white';
  if(key==='spare'){ return `<svg viewBox="${VB.cap}" aria-hidden="true">${silksInner(s, hex, {cap:k, capOnly:true})}</svg>`; }
  s[region] = k;
  return `<svg viewBox="${VB[key]}" aria-hidden="true">${silksInner(s, hex, region==='cap'?{capOnly:true}:{})}</svg>`;
}
function patternGrid(key, list){
  const k = key==='spare' ? st.spare : st[key];
  return `<div class="group"><h3>Pattern <span class="val">${patLabel(list,k.p)}</span></h3><div class="patterns">` +
    list.map(p=>`<button class="pt" aria-pressed="${k.p===p.id}" data-k="${key}" data-p="${p.id}" title="${p.note||p.name}">${thumb(key,p)}<span class="nm">${p.name}</span>${p.sub?`<span class="sb">${p.sub}</span>`:''}</button>`).join('') + '</div></div>';
}
function renderPanel(){
  const list = tab==='body'?BODY:tab==='sleeves'?SLEEVES:CAPS;
  let h='';
  if(tab==='spare'){
    h += `<label class="toggle"><input type="checkbox" id="spareOn" ${st.spare.on?'checked':''}><span>Add a second cap for when two of your horses run in the same race. Article 34.4 asks for a different coloured cap.</span></label>`;
    if(!st.spare.on){ $('panel').innerHTML = h; bindPanel(); return; }
  }
  const k = tab==='spare'?st.spare:st[tab];
  const lbl = {body:'Body colour',sleeves:'Sleeve colour',cap:'Cap colour',spare:'Cap colour'}[tab];
  h += swatchRow(tab,'c',lbl);
  if(k.p!=='plain') h += swatchRow(tab,'pc', tab==='body' ? 'Pattern or symbol colour' : 'Pattern colour');
  else h += `<p class="hint">Pick a pattern below, then choose its colour here.</p>`;
  h += patternGrid(tab,list);
  $('panel').innerHTML = h; bindPanel();
}
function bindPanel(){
  $('panel').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k==='spare'?st.spare:st[b.dataset.k]; k[b.dataset.f]=b.dataset.v; render();
  });
  $('panel').querySelectorAll('.pt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k==='spare'?st.spare:st[b.dataset.k]; k.p=b.dataset.p;
    if(k.p!=='plain' && k.pc===k.c) k.pc = k.c==='white'?'black':'white';
    render();
  });
  const t=$('spareOn'); if(t) t.onchange=()=>{ st.spare.on=t.checked; if(t.checked && st.spare.c===st.cap.c) st.spare.c = st.cap.c==='white'?'red':'white'; render(); };
}
$('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t; $('tabs').querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===b)); renderPanel();
});
$('reset').onclick=()=>{ st=DEFAULT(); render(); };

// ---------- export ----------
function standaloneSVG(inner, vb, w, h){
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${vb}" width="${w}" height="${h}"><defs>${buildDefs(GEO)}</defs>${inner}</svg>`;
}
function loadImg(svg){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
}
function wrap(ctx, text, x, y, maxW, lh){
  const words=text.split(' '); let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,x,y); y+=lh; line=w; } else line=t; }
  if(line){ ctx.fillText(line,x,y); y+=lh; } return y;
}
async function sheetBlob(){
  await document.fonts.ready;
  const W=1240,H=1754, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,H);
  c.fillStyle='#11202E'; c.fillRect(0,0,W,150); c.fillStyle='#AC9C71'; c.fillRect(0,150,W,6);
  c.fillStyle='#AC9C71'; c.font='500 24px Inter, sans-serif'; c.fillText('Rashid Equestrian & Horseracing Club',80,62);
  c.fillStyle='#FFFFFF'; c.font='700 44px Montserrat, Inter, sans-serif'; c.fillText('Racing colours design',80,118);
  try{ const lg=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=$('logo').src;}); const lh=110, lw=lh*343/132.4; c.drawImage(lg, W-80-lw, 20, lw, lh); }catch(e){}
  c.fillStyle='#F5F4F1'; c.fillRect(80,190,W-160,820);
  const main = await loadImg(standaloneSVG(silksInner(st,hex),'-6 -4 440 612',528,734));
  const mx = st.spare.on ? 290 : (W-528)/2;
  c.drawImage(main, mx, 232, 528, 734);
  if(st.spare.on){
    const sp = await loadImg(standaloneSVG(silksInner(st,hex,{cap:st.spare,capOnly:true}),'150 -4 128 142',220,244));
    c.drawImage(sp, 860, 700, 220, 244);
    c.fillStyle='#55606A'; c.font='400 22px Inter, sans-serif'; c.textAlign='center'; c.fillText('Second cap',970,975); c.textAlign='left';
  }
  let y=1080;
  c.fillStyle='#55606A'; c.font='600 22px Inter, sans-serif'; c.fillText('Colours description',80,y); y+=48;
  c.fillStyle='#11202E'; c.font='600 30px Montserrat, Inter, sans-serif'; y=wrap(c, description(), 80, y, W-160, 44);
  if(st.spare.on){ y=wrap(c, spareText(), 80, y+6, W-160, 46); }
  y+=20; c.fillStyle='#55606A'; c.font='400 22px Inter, sans-serif';
  y=wrap(c,'Registration runs to '+validUntil()+' (Article 34.1). Patterns as Rules of Racing, Annexe 6. Submit to the Racing Director with the registration fee.',80,y,W-160,32);
  y=Math.max(y+40,1440);
  c.strokeStyle='#9AA0A6'; c.lineWidth=1.5; c.fillStyle='#11202E'; c.font='500 22px Inter, sans-serif';
  [['Owner or partnership name',80,W-80],['Signature',80,600],['Date',660,W-80]].forEach(([l,x0,x1],i)=>{
    const yy = i===0 ? y : y+110;
    c.fillText(l,x0,yy); c.beginPath(); c.moveTo(x0,yy+50); c.lineTo(x1,yy+50); c.stroke();
    if(i===0 && ownerName()){ c.font='500 28px Inter, sans-serif'; c.fillText(ownerName(),x0,yy+40); c.font='500 22px Inter, sans-serif'; }
  });
  return await new Promise(r=>cv.toBlob(r,'image/png'));
}
// File naming follows the club standard: Owner-Name_C<cap number>, e.g. Stable-Owner-Name_C4
function ownerName(){ return ($('owner').value||'').trim().replace(/\s+/g,' '); }
function capNo(){ const n=parseInt($('capNo').value,10); return n>0 && n<100 ? n : 1; }
function fileBase(){
  const slug = ownerName().replace(/[^A-Za-z0-9\u0600-\u06FF\- ]/g,'').trim().replace(/ +/g,'-').replace(/-+/g,'-');
  return (slug || 'Owner') + '_C' + capNo();
}
function showFname(){ $('fname').textContent = 'Saves as ' + fileBase() + '.png / .svg' + (ownerName() ? '' : ' (add the owner name to replace "Owner")'); }
$('owner').addEventListener('input', showFname); $('capNo').addEventListener('input', showFname); showFname();

// downloads: claude.ai viewer uses the downloads capability; a plain hosted copy uses a normal link
let dl=null, dlReady=false;
const inViewer = !!(window.claude && window.claude.use);
if(inViewer){
  window.claude.use('downloads').then(d=>{ dl=d; dlReady=!!d; if(!d){ $('dlNote').hidden=false; $('dlNote').textContent='Downloads are not available in this view.'; } render(); });
} else { dlReady=true; }
async function save(name, blob){
  try{
    if(dl){ await dl.save({filename:name, data:blob}); }
    else if(!inViewer){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
  }catch(e){
    if(e && e.code==='declined') return;
    $('dlNote').hidden=false; $('dlNote').textContent = e && e.code==='rate_limited' ? 'A save prompt is already open. Finish that one first.' : 'The file could not be saved here.';
  }
}
$('dlSheet').onclick=async()=>{ const b=await sheetBlob(); save(fileBase()+'-sheet.png', b); };
// Silks files: 595 x 595 px, transparent, artwork 552 px tall centred with a 21 px top margin (club standard)
const SILK_PX = 595, SILK_VB = '-109.5 -22.8 646.1 646.1';
function silkSVG(){ return standaloneSVG(silksInner(st,hex), SILK_VB, SILK_PX, SILK_PX); }
$('dlSvg').onclick=()=>{
  save(fileBase()+'.svg', new Blob([silkSVG()],{type:'image/svg+xml'}));
};
$('dlPng').onclick=async()=>{
  const img = await loadImg(silkSVG());
  const cv=document.createElement('canvas'); cv.width=SILK_PX; cv.height=SILK_PX;
  cv.getContext('2d').drawImage(img,0,0,SILK_PX,SILK_PX);
  const b = await new Promise(r=>cv.toBlob(r,'image/png'));
  save(fileBase()+'.png', b);
};

render();
</script>
